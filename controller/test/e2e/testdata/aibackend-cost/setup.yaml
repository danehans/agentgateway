apiVersion: v1
kind: ConfigMap
metadata:
  name: local-oss-model-costs
  namespace: default
data:
  catalog.json: |
    {
      "providers": {
        "openai": {
          "models": {
            "meta-llama/Llama-3.1-8B-Instruct": {
              "rates": {
                "input": "0.000001",
                "output": "0.000001"
              }
            },
            "mistralai/Mistral-7B-Instruct-v0.3": {
              "rates": {
                "input": "0.1",
                "output": "0.1"
              }
            }
          }
        }
      }
    }
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ai-cost-router-params
  namespace: default
spec:
  modelCatalog:
    sources:
    - configMap:
        name: local-oss-model-costs
  aiLoadBalancing:
    profiles:
    - name: cost-optimized
      trigger:
        model: auto
      strategy: CostOptimized
      cost:
        defaultOutputTokens: 16
        missingPrice: FailClosed
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: ai-cost-router
  namespace: default
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: ai-cost-router-params
  listeners:
  - protocol: HTTP
    port: 80
    name: http
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-sim
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-sim
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
        args:
        - --model
        - meta-llama/Llama-3.1-8B-Instruct
        - --served-model-name
        - meta-llama/Llama-3.1-8B-Instruct
        - --force-dummy-tokenizer
        - --mode
        - echo
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 1
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: llama-sim
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: llama-sim
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-sim
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mistral-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mistral-sim
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
        args:
        - --model
        - mistralai/Mistral-7B-Instruct-v0.3
        - --served-model-name
        - mistralai/Mistral-7B-Instruct-v0.3
        - --force-dummy-tokenizer
        - --mode
        - echo
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 1
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: mistral-sim
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: mistral-sim
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpriced-sim
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unpriced-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpriced-sim
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
        args:
        - --model
        - deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
        - --served-model-name
        - deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
        - --force-dummy-tokenizer
        - --mode
        - echo
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 1
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: unpriced-sim
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: unpriced-sim
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: cost-optimized-sims
  namespace: default
spec:
  ai:
    groups:
    - providers:
      - name: llama
        openai:
          model: meta-llama/Llama-3.1-8B-Instruct
        host: llama-sim.default.svc.cluster.local
        port: 8000
      - name: mistral
        openai:
          model: mistralai/Mistral-7B-Instruct-v0.3
        host: mistral-sim.default.svc.cluster.local
        port: 8000
  policies:
    auth:
      key: fake-openai-key
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: unpriced-sim
  namespace: default
spec:
  ai:
    provider:
      openai:
        model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
      host: unpriced-sim.default.svc.cluster.local
      port: 8000
  policies:
    auth:
      key: fake-openai-key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-cost-routing
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ai-cost-router
  rules:
  - name: unpriced
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: unpriced-sim
    matches:
    - path:
        type: PathPrefix
        value: /v1/chat/completions
      headers:
      - type: Exact
        name: x-cost-test
        value: unpriced
  - name: cost-optimized
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: cost-optimized-sims
    matches:
    - path:
        type: PathPrefix
        value: /v1/chat/completions
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-cost-routing-observe
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ai-cost-routing
  traffic:
    transformation:
      response:
        add:
        - name: x-selected-request-model
          value: 'default(llm.requestModel, "not-set")'
        - name: x-selected-response-model
          value: 'default(llm.responseModel, "not-set")'
        - name: x-selected-provider
          value: 'default(llm.provider, "not-set")'
