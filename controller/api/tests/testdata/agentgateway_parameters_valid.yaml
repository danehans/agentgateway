apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: shutdown-min-gt-max
spec:
  shutdown:
    max: 0
    min: 0
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ai-lb-cost-optimized
spec:
  modelCatalog:
    sources:
    - configMap:
        name: model-costs
        key: catalog.json
  aiLoadBalancing:
    profiles:
    - name: cost
      trigger:
        model: auto
      strategy: CostOptimized
      cost:
        defaultOutputTokens: 512
        missingPrice: FailClosed
