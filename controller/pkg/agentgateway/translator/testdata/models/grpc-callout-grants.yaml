        message: ""
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: grpc-routing
        namespace: default
        sectionName: llm
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayModel
  metadata:
    name: premium-model
