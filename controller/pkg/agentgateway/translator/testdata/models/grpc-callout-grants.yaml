        message: gRPC routing backend denied is not permitted by ReferenceGrant
        reason: Invalid
        status: "False"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: grpc-routing
        namespace: default
        sectionName: llm
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayModel
  metadata:
    name: economy-model
    namespace: default
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: Successfully accepted AgentgatewayModel
        reason: Accepted
        status: "True"
